name: partner

# Routes every new comment on the Design Table, or on an issue labeled fork,
# to the partner who should answer it. Signed "- Chat" wakes Code's Partner
# routine. Signed "- Code" or "- Critic" wakes Chat's routine. Unsigned
# (Lotus) wakes both. Pacing: a partner gets three posts an hour; a wake
# beyond that waits until the oldest of the three leaves the window, then
# fires, so a long argument runs to its end at a round every twenty minutes
# instead of dying at an hour boundary. Hard stop: eight comments in an hour.
# A refused wake (routine paused, daily cap) is logged, not failed.

on:
  issue_comment:
    types: [created]

jobs:
  wake:
    if: contains(github.event.issue.labels.*.name, 'design-table') || contains(github.event.issue.labels.*.name, 'fork')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Route the comment to a partner routine
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PARTNER_URL: ${{ secrets.IRONWAKE_PARTNER_URL }}
          PARTNER_TOKEN: ${{ secrets.IRONWAKE_PARTNER_TOKEN }}
          CHAT_URL: ${{ secrets.IRONWAKE_CHAT_URL }}
          CHAT_TOKEN: ${{ secrets.IRONWAKE_CHAT_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          since="$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)"
          recent_json="$(gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments?since=$since&per_page=100" 2>/dev/null || echo '[]')"
          recent="$(printf '%s' "$recent_json" | jq 'length')"
          echo "last hour: $recent comments"
          if [ "${recent:-0}" -ge 8 ]; then
            echo "hard stop: $recent comments in the last hour; standing down"
            exit 0
          fi

          tail="$(printf '%s' "$COMMENT_BODY" | tr -d '\r' | tail -c 200)"
          case "$tail" in
            *"— Chat"*|*"-- Chat"*)                               target=partner ;;
            *"— Code"*|*"-- Code"*|*"— Critic"*|*"-- Critic"*)     target=chat ;;
            *)                                                    target=both ;;
          esac
          echo "routing to: $target"

          # Wait until the named signer has fewer than three posts in the trailing hour.
          pace() {
            sig="$1"
            third="$(printf '%s' "$recent_json" | jq -r --arg s "$sig" '[.[] | select(.body[-300:] | test("(—|--) " + $s))] | sort_by(.created_at) | reverse | .[2].created_at // empty')"
            if [ -n "$third" ]; then
              until_ts="$(( $(date -u -d "$third" +%s) + 3660 ))"
              now_ts="$(date -u +%s)"
              wait_s="$(( until_ts - now_ts ))"
              if [ "$wait_s" -gt 0 ]; then
                [ "$wait_s" -gt 3900 ] && wait_s=3900
                echo "$sig has three posts in the last hour; waiting ${wait_s}s for the window to roll"
                sleep "$wait_s"
              fi
            fi
          }

          wake() {
            url="$1"; token="$2"; name="$3"; sig="$4"
            if [ -z "$url" ] || [ -z "$token" ]; then
              echo "$name: secrets not set; skipping"
              return 0
            fi
            pace "$sig"
            text="New Design Table comment by $COMMENT_AUTHOR: $COMMENT_URL"
            payload="$(jq -cn --arg text "$text" '{text: $text}')"
            code="$(curl --silent --show-error -o /tmp/fire.out -w '%{http_code}' -X POST "$url" \
              -H "Authorization: Bearer $token" \
              -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
              -H "anthropic-version: 2023-06-01" \
              -H "Content-Type: application/json" \
              -d "$payload" || echo 000)"
            cat /tmp/fire.out; echo
            case "$code" in
              2*) echo "$name: woken" ;;
              *)  echo "$name: wake refused (HTTP $code); the nightly Builder answers instead" ;;
            esac
          }

          case "$target" in
            partner) wake "$PARTNER_URL" "$PARTNER_TOKEN" partner Code ;;
            chat)    wake "$CHAT_URL" "$CHAT_TOKEN" chat Chat ;;
            both)    wake "$PARTNER_URL" "$PARTNER_TOKEN" partner Code
                     wake "$CHAT_URL" "$CHAT_TOKEN" chat Chat ;;
          esac

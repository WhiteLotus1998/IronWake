name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      - run: dotnet run --no-build --configuration Release --project src/Ironwake.Sim -- --smoke
  ci-windows:
    name: ci-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      - run: dotnet run --no-build --configuration Release --project src/Ironwake.Sim -- --smoke
  godot-parity:
    name: godot-parity
    runs-on: ubuntu-latest
    env:
      GODOT_ZIP: Godot_v4.3-stable_mono_linux_x86_64.zip
      GODOT_SHA512: 33d0539bc368ff6f30b5f15d64ec893da8639bd607df83050b5df746c3d30da99238c26dd03a16d7fe31b3a3e58680aeb5545af8784d8ce01edeff07b061ac80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Fetch Godot 4.3-stable .NET and check its SHA-512
        run: |
          curl -sSfL -o "$RUNNER_TEMP/$GODOT_ZIP" "https://github.com/godotengine/godot/releases/download/4.3-stable/$GODOT_ZIP"
          echo "$GODOT_SHA512  $RUNNER_TEMP/$GODOT_ZIP" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/$GODOT_ZIP" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - run: dotnet build --configuration Release
      - run: dotnet build src/Ironwake.Godot/Ironwake.Godot.csproj
      - name: Client event log matches play --log byte for byte
        run: |
          mkdir -p "$RUNNER_TEMP/parity"
          for script in tests/parity/*.script; do
            name=$(basename "$script" .script); map=${name%-*}; seed=${name##*-}
            echo "$name: client (godot --parity)"
            status=0; timeout 120 "$GODOT" --headless --path src/Ironwake.Godot -- --map "$map" --seed "$seed" --parity "$PWD/$script" "$RUNNER_TEMP/parity/$name.client.log" || status=$?
            if [ "$status" -ne 0 ]; then echo "::error::$name: godot --parity exited $status (124 is the 120 s timeout)"; exit 1; fi
            echo "$name: console (play --log)"
            status=0; dotnet run --no-build --configuration Release --project src/Ironwake.Cli -- play "$map" --seed "$seed" --script "$script" --log "$RUNNER_TEMP/parity/$name.console.log" > "$RUNNER_TEMP/parity/$name.play.out" 2>&1 || status=$?
            if [ "$status" -ne 0 ]; then echo "::error::$name: play exited $status; the tail of its output:"; tail -n 40 "$RUNNER_TEMP/parity/$name.play.out"; exit 1; fi
            echo "$name: compare"
            if ! cmp "$RUNNER_TEMP/parity/$name.console.log" "$RUNNER_TEMP/parity/$name.client.log"; then echo "::error::$name: the client log differs from play --log"; diff "$RUNNER_TEMP/parity/$name.console.log" "$RUNNER_TEMP/parity/$name.client.log" | head -n 20; exit 1; fi
            echo "$name: identical"
          done
      - name: Full campaign event log matches campaign --log byte for byte
        run: |
          script=tests/parity/campaign/full-campaign-631.script
          start="--seed 631 --difficulty recruit --permadeath off"
          echo "full-campaign-631: client (godot --campaign-parity)"
          status=0; timeout 600 "$GODOT" --headless --path src/Ironwake.Godot -- $start --campaign-parity "$PWD/$script" "$RUNNER_TEMP/parity/full-campaign-631.client.log" || status=$?
          if [ "$status" -ne 0 ]; then echo "::error::full-campaign-631: godot --campaign-parity exited $status (124 is the 600 s timeout)"; exit 1; fi
          echo "full-campaign-631: console (campaign --log)"
          status=0; dotnet run --no-build --configuration Release --project src/Ironwake.Cli -- campaign $start --script "$script" --strict --log "$RUNNER_TEMP/parity/full-campaign-631.console.log" > "$RUNNER_TEMP/parity/full-campaign-631.play.out" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then echo "::error::full-campaign-631: campaign exited $status; the tail of its output:"; tail -n 40 "$RUNNER_TEMP/parity/full-campaign-631.play.out"; exit 1; fi
          if ! cmp "$RUNNER_TEMP/parity/full-campaign-631.console.log" "$RUNNER_TEMP/parity/full-campaign-631.client.log"; then echo "::error::full-campaign-631: the client log differs from campaign --log"; diff "$RUNNER_TEMP/parity/full-campaign-631.console.log" "$RUNNER_TEMP/parity/full-campaign-631.client.log" | head -n 20; exit 1; fi
          echo "full-campaign-631: identical"
      - name: The comparison fires on a log one character away
        run: |
          log="$RUNNER_TEMP/parity/brackwater_cut-53.console.log"
          sed '1s/^./#/' "$log" > "$RUNNER_TEMP/parity/altered.log"
          if cmp -s "$log" "$RUNNER_TEMP/parity/altered.log"; then echo "cmp missed an altered character"; exit 1; fi
          echo "altered log refused"
      - name: Mid-battle screenshot renders
        run: |
          timeout 120 xvfb-run -a -s "-screen 0 1280x800x24" "$GODOT" --rendering-driver opengl3 --path src/Ironwake.Godot -- --map brackwater_cut --seed 53 --script "$PWD/docs/screenshots/brackwater_cut-53-turn3.script" --select 11,3 --hover 11,3 --screenshot "$RUNNER_TEMP/screenshot.png"
          test -s "$RUNNER_TEMP/screenshot.png"
  godot-windows-export:
    name: godot-windows-export
    runs-on: ubuntu-latest
    env:
      GODOT_ZIP: Godot_v4.3-stable_mono_linux_x86_64.zip
      GODOT_SHA512: 33d0539bc368ff6f30b5f15d64ec893da8639bd607df83050b5df746c3d30da99238c26dd03a16d7fe31b3a3e58680aeb5545af8784d8ce01edeff07b061ac80
      TEMPLATES_TPZ: Godot_v4.3-stable_mono_export_templates.tpz
      TEMPLATES_SHA512: 76796c1df810ecf351b48f303e5525100597be48043d3206bab7c44bd0bc576fb944b4b788619eb9848c31b4245ae0df6f3d665e63d4a083f6dae829919e8e8d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Fetch Godot 4.3-stable .NET and its export templates and check their SHA-512
        run: |
          curl -sSfL -o "$RUNNER_TEMP/$GODOT_ZIP" "https://github.com/godotengine/godot/releases/download/4.3-stable/$GODOT_ZIP"
          echo "$GODOT_SHA512  $RUNNER_TEMP/$GODOT_ZIP" | sha512sum -c -
          curl -sSfL -o "$RUNNER_TEMP/$TEMPLATES_TPZ" "https://github.com/godotengine/godot/releases/download/4.3-stable/$TEMPLATES_TPZ"
          echo "$TEMPLATES_SHA512  $RUNNER_TEMP/$TEMPLATES_TPZ" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/$GODOT_ZIP" -d "$RUNNER_TEMP"
          templates="$HOME/.local/share/godot/export_templates/4.3.stable.mono"
          mkdir -p "$templates"
          unzip -q -j "$RUNNER_TEMP/$TEMPLATES_TPZ" templates/version.txt 'templates/windows_*_x86_64*.exe' -d "$templates"
          rm "$RUNNER_TEMP/$TEMPLATES_TPZ"
          echo "GODOT=$RUNNER_TEMP/Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Export the Windows Desktop preset
        run: |
          mkdir -p build/windows
          timeout 600 "$GODOT" --headless --path src/Ironwake.Godot --export-release "Windows Desktop"
          test -s build/windows/Ironwake.exe
          # The export exits 0 even when its dotnet publish fails, leaving an exe with no scripts.
          test -s build/windows/data_Ironwake.Godot_windows_x86_64/Ironwake.Godot.dll
          cp -r content build/windows/content
      - uses: actions/upload-artifact@v4
        with:
          name: ironwake-windows
          path: build/windows/
          if-no-files-found: error
  godot-windows-launch:
    name: godot-windows-launch
    needs: godot-windows-export
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - uses: actions/download-artifact@v4
        with:
          name: ironwake-windows
          path: build/windows
      - run: dotnet build src/Ironwake.Cli --configuration Release
      - name: The exported Ironwake.exe matches play --log byte for byte
        run: |
          out=$(cygpath -u "$RUNNER_TEMP")/parity; mkdir -p "$out"
          for script in tests/parity/*.script; do
            name=$(basename "$script" .script); map=${name%-*}; seed=${name##*-}
            echo "$name: client (Ironwake.exe --parity)"
            status=0; timeout 120 build/windows/Ironwake.exe --headless -- --map "$map" --seed "$seed" --parity "$(cygpath -w "$PWD/$script")" "$(cygpath -w "$out/$name.client.log")" || status=$?
            if [ "$status" -ne 0 ]; then echo "::error::$name: Ironwake.exe --parity exited $status (124 is the 120 s timeout)"; exit 1; fi
            echo "$name: console (play --log)"
            status=0; dotnet run --no-build --configuration Release --project src/Ironwake.Cli -- play "$map" --seed "$seed" --script "$script" --log "$(cygpath -w "$out/$name.console.log")" > "$out/$name.play.out" 2>&1 || status=$?
            if [ "$status" -ne 0 ]; then echo "::error::$name: play exited $status; the tail of its output:"; tail -n 40 "$out/$name.play.out"; exit 1; fi
            echo "$name: compare"
            if ! cmp "$out/$name.console.log" "$out/$name.client.log"; then echo "::error::$name: the client log differs from play --log"; diff "$out/$name.console.log" "$out/$name.client.log" | head -n 20; exit 1; fi
            echo "$name: identical"
          done

name: builder-chain

# Keeps the Builder running back to back. When a Builder PR (an issue/ branch)
# merges, this fires the next Builder run, which takes one issue and exits.
# It runs only while the repo variable IRONWAKE_CHAIN is "on" and the clock is
# before IRONWAKE_CHAIN_UNTIL (UTC, ISO 8601), and never when the queue of
# ready, unblocked issues is empty or an issue labeled fork is open. A refused
# wake (routine paused, daily cap) is logged, not failed. The hourly cron
# slots stay as the backstop.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  chain:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'issue/'))
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to fire the next Builder run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHAIN: ${{ vars.IRONWAKE_CHAIN }}
          UNTIL: ${{ vars.IRONWAKE_CHAIN_UNTIL }}
          BUILDER_URL: ${{ secrets.IRONWAKE_BUILDER_URL }}
          BUILDER_TOKEN: ${{ secrets.IRONWAKE_BUILDER_TOKEN }}
          MERGED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$CHAIN" != "on" ]; then echo "chain is off"; exit 0; fi
          if [ -z "$BUILDER_URL" ] || [ -z "$BUILDER_TOKEN" ]; then echo "builder secrets not set"; exit 0; fi
          now="$(date -u +%s)"
          if [ -n "$UNTIL" ]; then
            until_ts="$(date -u -d "$UNTIL" +%s 2>/dev/null || echo 0)"
            if [ "$now" -ge "$until_ts" ]; then echo "chain deadline $UNTIL has passed"; exit 0; fi
          fi
          forks="$(gh api "repos/$REPO/issues?labels=fork&state=open&per_page=1" --jq 'length')"
          if [ "${forks:-0}" -gt 0 ]; then echo "a fork issue is open; the chain waits for Lotus"; exit 0; fi
          ready="$(gh api "repos/$REPO/issues?labels=ready&state=open&per_page=100" --jq '[.[] | select(.pull_request == null) | select([.labels[].name] | index("blocked") | not) | select([.labels[].name] | index("in-progress") | not)] | length')"
          if [ "${ready:-0}" -eq 0 ]; then echo "queue is empty; nothing to chain"; exit 0; fi
          text="Chain mode: do exactly one issue and stop; the merge of your PR fires the next run. Woken by the merge of ${MERGED_BRANCH:-a manual dispatch}; $ready issues ready."
          payload="$(jq -cn --arg text "$text" '{text: $text}')"
          code="$(curl --silent --show-error -o /tmp/fire.out -w '%{http_code}' -X POST "$BUILDER_URL" \
            -H "Authorization: Bearer $BUILDER_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$payload" || echo 000)"
          cat /tmp/fire.out; echo
          case "$code" in
            2*) echo "builder: woken ($ready ready)" ;;
            *)  echo "builder: wake refused (HTTP $code); the hourly slot picks it up" ;;
          esac

name: builder-chain

# Keeps the Builder running back to back. When a Builder PR (an issue/ or
# claude/issue- branch) merges, this fires the next Builder run, which takes
# one issue and exits. It runs only while the repo variable IRONWAKE_CHAIN is
# "on" and the clock is before IRONWAKE_CHAIN_UNTIL (UTC, ISO 8601), and
# never when the queue of ready, unblocked issues is empty, an issue labeled
# fork is open, or another Builder may still be working: an open issue other
# than the merged branch's own that took `in-progress` less than an hour
# ago. A run's budget is about 50 minutes, so a label younger than that
# means a cron-slot or chained Builder may be alive on it; a dead run's
# stale label delays the chain by at most an hour, and the hourly cron slots
# pick the queue up. The ready count includes every phase-3 issue, so the
# empty-queue guard is a formality and the deadline is the real stop. A
# refused wake (routine paused, daily cap) is logged, not failed.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  chain:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && (startsWith(github.event.pull_request.head.ref, 'issue/') || startsWith(github.event.pull_request.head.ref, 'claude/issue-')))
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to fire the next Builder run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHAIN: ${{ vars.IRONWAKE_CHAIN }}
          UNTIL: ${{ vars.IRONWAKE_CHAIN_UNTIL }}
          BUILDER_URL: ${{ secrets.IRONWAKE_BUILDER_URL }}
          BUILDER_TOKEN: ${{ secrets.IRONWAKE_BUILDER_TOKEN }}
          MERGED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$CHAIN" != "on" ]; then echo "chain is off"; exit 0; fi
          if [ -z "$BUILDER_URL" ] || [ -z "$BUILDER_TOKEN" ]; then echo "builder secrets not set"; exit 0; fi
          now="$(date -u +%s)"
          if [ -n "$UNTIL" ]; then
            until_ts="$(date -u -d "$UNTIL" +%s 2>/dev/null || echo 0)"
            if [ "$now" -ge "$until_ts" ]; then echo "chain deadline $UNTIL has passed"; exit 0; fi
          fi
          forks="$(gh api "repos/$REPO/issues?labels=fork&state=open&per_page=1" --jq 'length')"
          if [ "${forks:-0}" -gt 0 ]; then echo "a fork issue is open; the chain waits for Lotus"; exit 0; fi

          # The merged branch's own issue may still carry in-progress for a beat
          # after the merge; it is the run that just finished, not a live one.
          own="$(printf '%s' "$MERGED_BRANCH" | sed -n -E 's#^(claude/issue-|issue/)([0-9]+).*#\2#p')"
          busy="$(gh api "repos/$REPO/issues?labels=in-progress&state=open&per_page=100" --jq '[.[] | select(.pull_request == null) | .number] | join(" ")')"
          for n in $busy; do
            if [ "$n" = "${own:-none}" ]; then continue; fi
            # --paginate runs the filter once per page, so the latest is taken across pages.
            labeled="$(gh api --paginate "repos/$REPO/issues/$n/events?per_page=100" --jq '[.[] | select(.event == "labeled" and .label.name == "in-progress") | .created_at] | max // empty' | sort | tail -n 1)"
            if [ -z "$labeled" ]; then continue; fi
            age="$(( now - $(date -u -d "$labeled" +%s) ))"
            if [ "$age" -lt 3600 ]; then
              echo "issue #$n took in-progress ${age}s ago; another Builder may be on it, so the chain stands down and the hourly slot picks the queue up"
              exit 0
            fi
          done

          ready="$(gh api "repos/$REPO/issues?labels=ready&state=open&per_page=100" --jq '[.[] | select(.pull_request == null) | select([.labels[].name] | index("blocked") | not) | select([.labels[].name] | index("in-progress") | not)] | length')"
          if [ "${ready:-0}" -eq 0 ]; then echo "queue is empty; nothing to chain"; exit 0; fi
          text="Chain mode: do exactly one issue and stop; the merge of your PR fires the next run. Woken by the merge of ${MERGED_BRANCH:-a manual dispatch}; $ready issues ready."
          payload="$(jq -cn --arg text "$text" '{text: $text}')"
          code="$(curl --silent --show-error -o /tmp/fire.out -w '%{http_code}' -X POST "$BUILDER_URL" \
            -H "Authorization: Bearer $BUILDER_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$payload" || echo 000)"
          cat /tmp/fire.out; echo
          case "$code" in
            2*) echo "builder: woken ($ready ready)" ;;
            *)  echo "builder: wake refused (HTTP $code); the hourly slot picks it up" ;;
          esac
